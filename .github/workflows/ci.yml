name: CI

# PHP 8.4 and 8.5, PostgreSQL 18.7 and 19.0, Node.js 26.13.1.
# Migrations, scripts/ci/sql/unindexed-fks.sql, then Pest on PostgreSQL and SQLite.
# PHPStan, Pint, and docx/vue test, typecheck and build.
# Sibling path repositories are checked out beside the workspace before Composer
# or npm installs that need them. The PHP job builds packages/docx/dist/cli.js
# (Node.js 26.13.1, npm ci, docx build) before Pest. Packman is fetched at
# refs/tags/v0.1.2, the version pinned by the Composer path repositories.
# Private sibling checkouts use secrets.VAULTER_READ_TOKEN when the default
# token cannot read axiomasoft/vaulter, vaulter-collaboration, and packman.
# Stop-cranes from engineering-standards §2, enforced before review:
# Zero-Royalty denylist (0 forbidden packages, no UNLICENSED, no @tiptap-pro),
# 64-bit hashtextextended locks, no session pg_advisory_lock, no DEFERRABLE
# INITIALLY DEFERRED, no raw DB::transaction(), no set_config(..., false),
# no parse_url(), no ZipArchive::extractTo(), no CURLOPT_RESOLVE, no unindexed
# FK, no Helpers/Utils/Common/Misc/Traits directories, no @phpstan-ignore,
# no @psalm-suppress, no test ->skip(), no Eloquent Model on an #[Api]
# surface, no libclamav linkage, no registry.tiptap.dev.
# scripts/ci/engineering-rails.py carries a negative fixture (--self-test) that must
# fail when a forbidden package, an UNLICENSED license, or a banned call is introduced.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-cranes:
    name: Stop-cranes / Node 26.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          python3 scripts/ci/engineering-rails.py --root "$GITHUB_WORKSPACE"
          python3 scripts/ci/engineering-rails.py --self-test

  php:
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
        include:
          - postgres: '18.7'
            image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          - postgres: '19.0'
            image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Build DOCX CLI
        run: |
          npm ci
          npm --workspace=@vaulter/editor-pro-docx run build
          test -f packages/docx/dist/cli.js

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -d vaulter -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          expected="${{ matrix.postgres }}"
          case "${ver}" in
            ${expected}*) ;;
            *) echo "expected PostgreSQL ${expected}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Create suite database
        run: psql -d vaulter -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vaulter_test'

      - name: Run database migrations on PostgreSQL
        run: php scripts/ci/migrate-suite.php

      - name: Zero unindexed foreign keys
        run: psql -d vaulter_test -v ON_ERROR_STOP=1 -f scripts/ci/sql/unindexed-fks.sql

      - name: Pest on PostgreSQL ${{ matrix.postgres }}
        run: composer test

      - name: Pest on SQLite
        if: matrix.postgres == '18.7'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: composer test

  static:
    name: PHP ${{ matrix.php }} static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: composer phpstan

      - name: Pint
        run: composer lint:check

  node:
    name: Node 26.13.1 docx and vue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Build sibling @vaulter/vue
        run: |
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          npm --prefix "$workspace/vaulter" ci && npm --prefix "$workspace/vaulter" run build --workspace @vaulter/vue

      - name: Install npm dependencies
        run: npm ci

      - name: docx test, typecheck and build
        run: |
          npm --workspace=@vaulter/editor-pro-docx test
          npm --workspace=@vaulter/editor-pro-docx run typecheck
          npm --workspace=@vaulter/editor-pro-docx run build

      - name: vue test, typecheck and build
        run: |
          npm --workspace=@vaulter/editor-pro-vue test
          npm --workspace=@vaulter/editor-pro-vue run typecheck
          npm --workspace=@vaulter/editor-pro-vue run build

  docx-libreoffice:
    name: DOCX LibreOffice roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install and build @vaulter/editor-pro-docx
        run: |
          npm ci
          npm --workspace=@vaulter/editor-pro-docx run build

      - name: Run headless LibreOffice D1-D5 roundtrip gate
        run: bash scripts/ci/docx-libreoffice.sh

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaulter -d vaulter_e2e_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          extensions: mbstring, xml, zip, pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install sibling dependencies
        run: |
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          npm --prefix "$workspace/vaulter" ci
          npm --prefix "$workspace/vaulter" run build --workspace @vaulter/vue
          npm --prefix "$workspace/vaulter-collaboration" ci

      - name: Install editor-pro dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm --workspace=@vaulter/editor-pro-docx run build
          npm --workspace=@vaulter/editor-pro-vue run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: "5432"
          E2E_DB_DATABASE: vaulter_e2e_test
          E2E_DB_USERNAME: vaulter
          E2E_DB_PASSWORD: secret
        run: npx playwright test --config=tests/e2e/playwright.config.mjs

  ci-gate:
    name: CI gate
    if: always()
    needs: [stop-cranes, php, static, node, docx-libreoffice, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The one check a branch rule has to require: red unless every job (and every matrix cell) succeeded,
      # so a failed, cancelled or skipped lane can never pass as green.
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e -r 'to_entries | map(select(.value.result != "success") | "\(.key): \(.value.result)") | if length == 0 then "all jobs succeeded" else (join("\n") | halt_error(1)) end' <<< "$NEEDS"
