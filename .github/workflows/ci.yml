name: CI

# PHP 8.4 and 8.5, PostgreSQL 18.7 and 19.0, Node.js 26.13.1.
# Migrations, scripts/ci/sql/unindexed-fks.sql, then Pest on PostgreSQL and SQLite.
# PHPStan, Pint, and docx/vue test, typecheck and build.
# Sibling path repositories are checked out beside the workspace before Composer
# or npm installs that need them. The PHP job builds packages/docx/dist/cli.js
# (Node.js 26.13.1, npm ci, docx build) before Pest. Packman is fetched at
# refs/tags/v0.1.2, the version pinned by the Composer path repositories.
# Private sibling checkouts use secrets.VAULTER_READ_TOKEN when the default
# token cannot read axiomasoft/vaulter, vaulter-collaboration, and packman.
# Stop-cranes from engineering-standards §2, enforced before review:
# Zero-Royalty denylist (0 forbidden packages, no UNLICENSED, no @tiptap-pro),
# 64-bit hashtextextended locks, no session pg_advisory_lock, no DEFERRABLE
# INITIALLY DEFERRED, no raw DB::transaction(), no set_config(..., false),
# no parse_url(), no ZipArchive::extractTo(), no CURLOPT_RESOLVE, no unindexed
# FK, no Helpers/Utils/Common/Misc/Traits directories, no @phpstan-ignore,
# no @psalm-suppress, no test ->skip(), no Eloquent Model on an #[Api]
# surface, no libclamav linkage, no registry.tiptap.dev.
# The embedded checker carries a negative fixture (--self-test) that must fail
# when a forbidden package, an UNLICENSED license, or a banned call is introduced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-cranes:
    name: Stop-cranes / Node 26.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          cat > "$RUNNER_TEMP/stop-cranes.py" <<'PY'
          #!/usr/bin/env python3
          """Scaffold stop-cranes for a Vaulter satellite repository.

          Scans committed manifests and sources for the Zero-Royalty denylist
          (including UNLICENSED and Pro packages) and the source bans in
          engineering-standards §2 that a text scan can see. Exit 0
          means zero hits. ``--self-test`` proves a forbidden tree fails and an
          allowed twin passes.
          """

          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          import tempfile
          from pathlib import Path

          FORBIDDEN_EXACT = frozenset(
              {
                  "handsontable",
                  "hyperformula",
                  "dunglas/mercure",
                  "minio/minio",
                  "exceljs",
                  "unzipper",
                  "mammoth",
                  "xlsx",
                  "libclamav",
                  "@tiptap-pro",
                  "@univerjs-pro",
                  "@univer-cli",
              }
          )
          FORBIDDEN_PREFIXES = ("@tiptap-pro/", "@univerjs-pro/", "@univer-cli/")
          DEP_KEYS = frozenset(
              {
                  "require",
                  "require-dev",
                  "conflict",
                  "dependencies",
                  "devDependencies",
                  "optionalDependencies",
                  "peerDependencies",
              }
          )
          SKIP_DIRS = frozenset(
              {
                  ".git",
                  "vendor",
                  "node_modules",
                  "build",
                  "dist",
                  "coverage",
                  ".github",
                  ".phpunit.cache",
              }
          )
          SOURCE_EXT = frozenset({".php", ".sql", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".vue"})
          LOCK_NAMES = frozenset({"composer.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"})
          LOCK_NEEDLES = (
              "@tiptap-pro/",
              "@univerjs-pro/",
              "@univer-cli/",
              "registry.tiptap.dev",
              "handsontable",
              "hyperformula",
              "dunglas/mercure",
              "minio/minio",
              "exceljs",
              "unzipper",
              "mammoth",
              "libclamav",
              "xlsx@0.18.5",
          )
          BANNED = (
              ("hashtext(", re.compile(r"\bhashtext\s*\(")),
              ("session advisory lock", re.compile(r"\bpg_(?:try_)?advisory_lock\s*\(")),
              ("DEFERRABLE INITIALLY DEFERRED", re.compile(r"DEFERRABLE\s+INITIALLY\s+DEFERRED", re.I)),
              ("DB::transaction()", re.compile(r"\bDB::transaction\s*\(")),
              ("set_config(..., false)", re.compile(r"\bset_config\s*\([^;]*\bfalse\b", re.I)),
              ("parse_url()", re.compile(r"\bparse_url\s*\(")),
              ("ZipArchive::extractTo()", re.compile(r"\bZipArchive::extractTo\s*\(")),
              ("CURLOPT_RESOLVE", re.compile(r"\bCURLOPT_RESOLVE\b")),
              ("@phpstan-ignore", re.compile(r"@phpstan-ignore\b")),
              ("@psalm-suppress", re.compile(r"@psalm-suppress\b")),
              ("REPACK (CONCURRENTLY)", re.compile(r"\bREPACK\s*\(\s*CONCURRENTLY\b", re.I)),
              ("libclamav", re.compile(r"\blibclamav\b")),
              ("registry.tiptap.dev", re.compile(r"registry\.tiptap\.dev")),
          )
          SKIP_CALL = re.compile(r"->skip\s*\(")
          ELOQUENT = "Illuminate\\Database\\Eloquent\\Model"
          FORBIDDEN_DIR_NAMES = frozenset({"Helpers", "Utils", "Common", "Misc", "Traits"})
          COPYLEFT = re.compile(r"\b(?:AGPL|GPL|SSPL)(?:-|\b)", re.I)
          MANIFEST_NAMES = frozenset({"composer.json", "package.json"})



          def license_texts(value: object) -> list[str]:
              found: list[str] = []
              if isinstance(value, str):
                  found.append(value)
              elif isinstance(value, dict):
                  inner = value.get("type")
                  if isinstance(inner, str):
                      found.append(inner)
              elif isinstance(value, list):
                  for item in value:
                      found.extend(license_texts(item))
              return found


          def forbidden_name(name: str) -> str | None:
              if name in FORBIDDEN_EXACT:
                  return name
              for prefix in FORBIDDEN_PREFIXES:
                  if name.startswith(prefix):
                      return name
              return None


          def add(hits: list[str], path: Path, detail: str) -> None:
              hits.append(f"{path}: {detail}")


          def walk_deps(node: object, hits: list[str], path: Path) -> None:
              if isinstance(node, dict):
                  name = node.get("name")
                  if isinstance(name, str):
                      bad = forbidden_name(name)
                      if bad is not None:
                          add(hits, path, f"forbidden package {bad}")
                  for license_text in license_texts(node.get("license")):
                      if license_text.strip().upper() == "UNLICENSED":
                          add(hits, path, "UNLICENSED license")
                      elif COPYLEFT.search(license_text) or "tiptap-pro" in license_text.lower():
                          add(hits, path, f"prohibited license {license_text}")
                  for key, value in node.items():
                      if key in DEP_KEYS and isinstance(value, dict):
                          for dep in value:
                              if isinstance(dep, str):
                                  bad = forbidden_name(dep)
                                  if bad is not None:
                                      add(hits, path, f"forbidden dependency {bad}")
                      else:
                          walk_deps(value, hits, path)
              elif isinstance(node, list):
                  for item in node:
                      walk_deps(item, hits, path)


          def is_source(path: Path) -> bool:
              return path.name == "Dockerfile" or path.name.startswith("Dockerfile.") or path.suffix in SOURCE_EXT


          def is_test(path: Path) -> bool:
              if path.name.endswith("Test.php") or ".test." in path.name:
                  return True
              return "tests" in path.parts


          def skipped(path: Path) -> bool:
              return any(part in SKIP_DIRS for part in path.parts)


          def scan(root: Path) -> list[str]:
              hits: list[str] = []
              if not root.is_dir():
                  return [f"{root}: not a directory"]

              composer = root / "composer.json"
              if not composer.is_file():
                  hits.append(f"{composer}: missing")
              else:
                  try:
                      data = json.loads(composer.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      hits.append(f"{composer}: invalid JSON ({exc})")
                      data = None
                  if isinstance(data, dict):
                      php = (data.get("require") or {}).get("php")
                      if php != ">=8.4 <8.6":
                          hits.append(f"{composer}: require.php must be >=8.4 <8.6, got {php!r}")

              package = root / "package.json"
              if not package.is_file():
                  hits.append(f"{package}: missing")
              else:
                  try:
                      data = json.loads(package.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      hits.append(f"{package}: invalid JSON ({exc})")
                      data = None
                  if isinstance(data, dict):
                      node = (data.get("engines") or {}).get("node")
                      if node != ">=26.13.1":
                          hits.append(f"{package}: engines.node must be >=26.13.1, got {node!r}")

              for path in root.rglob("*"):
                  if skipped(path):
                      continue
                  if path.is_dir():
                      if path.name in FORBIDDEN_DIR_NAMES:
                          add(hits, path, "forbidden directory name")
                      continue
                  if path.name in MANIFEST_NAMES or path.name in LOCK_NAMES and path.suffix == ".json":
                      try:
                          walk_deps(json.loads(path.read_text(encoding="utf-8")), hits, path)
                      except json.JSONDecodeError as exc:
                          add(hits, path, f"invalid JSON ({exc})")
                  if path.name in LOCK_NAMES:
                      text = path.read_text(encoding="utf-8", errors="replace")
                      for needle in LOCK_NEEDLES:
                          if needle in text:
                              add(hits, path, f"lockfile contains {needle}")
                  if not is_source(path):
                      continue
                  text = path.read_text(encoding="utf-8", errors="replace")
                  for label, pattern in BANNED:
                      if pattern.search(text):
                          add(hits, path, label)
                  if is_test(path) and SKIP_CALL.search(text):
                      add(hits, path, "->skip()")
                  if "#[Api]" in text and ELOQUENT in text:
                      add(hits, path, "Eloquent Model on an #[Api] surface")
              return hits


          def require_fail(label: str, root: Path) -> None:
              hits = scan(root)
              if not hits:
                  raise SystemExit(f"self-test {label}: expected hits, found none")


          def require_ok(label: str, root: Path) -> None:
              hits = scan(root)
              if hits:
                  raise SystemExit("self-test " + label + ": expected clean, got " + "; ".join(hits))


          def write_base(root: Path, node: str = ">=26.13.1", php: str = ">=8.4 <8.6") -> None:
              root.mkdir()
              (root / "composer.json").write_text(
                  json.dumps({"require": {"php": php}}),
                  encoding="utf-8",
              )
              (root / "package.json").write_text(
                  json.dumps({"engines": {"node": node}}),
                  encoding="utf-8",
              )


          def self_test() -> int:
              with tempfile.TemporaryDirectory() as tmp:
                  base = Path(tmp)

                  clean = base / "clean"
                  write_base(clean)
                  (clean / "ok.php").write_text(
                      "<?php pg_advisory_xact_lock(hashtextextended($k, 0));\n",
                      encoding="utf-8",
                  )
                  (clean / "ok.sql").write_text("DEFERRABLE INITIALLY IMMEDIATE\n", encoding="utf-8")
                  require_ok("allowed calls", clean)

                  bad_pkg = base / "pkg"
                  write_base(bad_pkg)
                  (bad_pkg / "composer.json").write_text(
                      json.dumps({"require": {"php": ">=8.4 <8.6", "handsontable": "^1.0"}}),
                      encoding="utf-8",
                  )
                  require_fail("handsontable", bad_pkg)

                  bad_scope = base / "scope"
                  write_base(bad_scope)
                  (bad_scope / "package.json").write_text(
                      json.dumps(
                          {
                              "engines": {"node": ">=26.13.1"},
                              "dependencies": {"@tiptap-pro/extension-comments": "1.0.0"},
                          }
                      ),
                      encoding="utf-8",
                  )
                  require_fail("@tiptap-pro", bad_scope)


                  bad_license = base / "unlicensed"
                  write_base(bad_license)
                  (bad_license / "package.json").write_text(
                      json.dumps(
                          {
                              "license": "UNLICENSED",
                              "engines": {"node": ">=26.13.1"},
                          }
                      ),
                      encoding="utf-8",
                  )
                  require_fail("UNLICENSED", bad_license)

                  bad_hash = base / "hash"
                  write_base(bad_hash)
                  (bad_hash / "lock.php").write_text("<?php hashtext($k);\n", encoding="utf-8")
                  require_fail("hashtext", bad_hash)

                  bad_lock = base / "lock"
                  write_base(bad_lock)
                  (bad_lock / "session.php").write_text("<?php pg_advisory_lock($k);\n", encoding="utf-8")
                  require_fail("pg_advisory_lock", bad_lock)

                  bad_sql = base / "sql"
                  write_base(bad_sql)
                  (bad_sql / "hot.sql").write_text(
                      "ALTER TABLE t ADD CONSTRAINT c FOREIGN KEY (id) REFERENCES p(id) DEFERRABLE INITIALLY DEFERRED;\n",
                      encoding="utf-8",
                  )
                  require_fail("INITIALLY DEFERRED", bad_sql)

                  bad_dir = base / "dirs"
                  write_base(bad_dir)
                  (bad_dir / "Helpers").mkdir()
                  require_fail("Helpers", bad_dir)

                  bad_node = base / "node"
                  write_base(bad_node, node=">=26")
                  require_fail("engines.node", bad_node)

              print("stop-crane self-test: pass")
              return 0


          def main(argv: list[str]) -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--root", default=".")
              parser.add_argument("--self-test", action="store_true")
              args = parser.parse_args(argv)
              if args.self_test:
                  return self_test()
              hits = scan(Path(args.root).resolve())
              if hits:
                  print(f"stop-cranes: {len(hits)} hit(s)")
                  for hit in hits:
                      print(hit)
                  return 1
              print("stop-cranes: 0 hits")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
          python3 "$RUNNER_TEMP/stop-cranes.py" --root "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/stop-cranes.py" --self-test

  php:
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          workspace="$(dirname "$root")"
          fetch_dependency() {
            local directory="$1" url="$2" ref="$3"
            local dest="$workspace/$directory"
            if [ -e "$dest" ]; then
              echo "sibling present: $dest"
              return 0
            fi
            mkdir -p "$dest"
            git -C "$dest" init -q
            git -C "$dest" fetch --quiet --depth=1 "$url" "$ref"
            git -C "$dest" checkout -q -b main FETCH_HEAD
          }
          if [ -n "${VAULTER_READ_TOKEN}" ]; then
            base="https://x-access-token:${VAULTER_READ_TOKEN}@github.com/axiomasoft"
          else
            base="https://github.com/axiomasoft"
          fi
          fetch_dependency vaulter "$base/vaulter.git" refs/heads/main
          fetch_dependency vaulter-collaboration "$base/vaulter-collaboration.git" refs/heads/main
          fetch_dependency packman "$base/packman.git" refs/tags/v0.1.2

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Build DOCX CLI
        run: |
          npm ci
          npm --workspace=@vaulter/editor-pro-docx run build
          test -f packages/docx/dist/cli.js

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -d vaulter -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          expected="${{ matrix.postgres }}"
          case "${ver}" in
            ${expected}*) ;;
            *) echo "expected PostgreSQL ${expected}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Create suite database
        run: psql -d vaulter -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vaulter_test'

      - name: Run database migrations on PostgreSQL
        run: php scripts/ci/migrate-suite.php

      - name: Zero unindexed foreign keys
        run: psql -d vaulter_test -v ON_ERROR_STOP=1 -f scripts/ci/sql/unindexed-fks.sql

      - name: Pest on PostgreSQL ${{ matrix.postgres }}
        run: composer test

      - name: Pest on SQLite
        if: matrix.postgres == '18.7'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: composer test

  static:
    name: PHP ${{ matrix.php }} static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          workspace="$(dirname "$root")"
          fetch_dependency() {
            local directory="$1" url="$2" ref="$3"
            local dest="$workspace/$directory"
            if [ -e "$dest" ]; then
              echo "sibling present: $dest"
              return 0
            fi
            mkdir -p "$dest"
            git -C "$dest" init -q
            git -C "$dest" fetch --quiet --depth=1 "$url" "$ref"
            git -C "$dest" checkout -q -b main FETCH_HEAD
          }
          if [ -n "${VAULTER_READ_TOKEN}" ]; then
            base="https://x-access-token:${VAULTER_READ_TOKEN}@github.com/axiomasoft"
          else
            base="https://github.com/axiomasoft"
          fi
          fetch_dependency vaulter "$base/vaulter.git" refs/heads/main
          fetch_dependency vaulter-collaboration "$base/vaulter-collaboration.git" refs/heads/main
          fetch_dependency packman "$base/packman.git" refs/tags/v0.1.2

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: composer phpstan

      - name: Pint
        run: composer lint:check

  node:
    name: Node 26.13.1 docx and vue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          workspace="$(dirname "$root")"
          fetch_dependency() {
            local directory="$1" url="$2" ref="$3"
            local dest="$workspace/$directory"
            if [ -e "$dest" ]; then
              echo "sibling present: $dest"
              return 0
            fi
            mkdir -p "$dest"
            git -C "$dest" init -q
            git -C "$dest" fetch --quiet --depth=1 "$url" "$ref"
            git -C "$dest" checkout -q -b main FETCH_HEAD
          }
          if [ -n "${VAULTER_READ_TOKEN}" ]; then
            base="https://x-access-token:${VAULTER_READ_TOKEN}@github.com/axiomasoft"
          else
            base="https://github.com/axiomasoft"
          fi
          fetch_dependency vaulter "$base/vaulter.git" refs/heads/main

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Build sibling @vaulter/vue
        run: |
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          npm --prefix "$workspace/vaulter" ci && npm --prefix "$workspace/vaulter" run build --workspace @vaulter/vue

      - name: Install npm dependencies
        run: npm ci

      - name: docx test, typecheck and build
        run: |
          npm --workspace=@vaulter/editor-pro-docx test
          npm --workspace=@vaulter/editor-pro-docx run typecheck
          npm --workspace=@vaulter/editor-pro-docx run build

      - name: vue test, typecheck and build
        run: |
          npm --workspace=@vaulter/editor-pro-vue test
