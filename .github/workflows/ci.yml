name: CI

# DAG (GitHub draws this from `needs`):
#   changes → quality → { php, node, docx-libreoffice, e2e } → CI gate
#
# quality is the fast fail: stop-cranes, composer validate, Pint, PHPStan,
# actionlint and zizmor. The heavier lanes only start after it succeeds.
# Path filters skip unaffected lanes on feature branches; a push to main,
# workflow_dispatch, or a change under .github/ always runs every lane.
# `CI gate` is the single check a branch rule should require (skipped lanes are allowed).
#
# Siblings (../vaulter, ../vaulter-collaboration, ../packman) come from
# scripts/ci/checkout-ecosystem.sh. VAULTER_READ_TOKEN is optional now that those
# repositories are public; when set, it is sent as an HTTP header (never in a URL).

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**', 'hotfix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
  COMPOSER_NO_INTERACTION: "1"

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      php: ${{ steps.plan.outputs.php }}
      node: ${{ steps.plan.outputs.node }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            php:
              - "**/*.php"
              - "**/composer.json"
              - "composer.lock"
              - "phpstan*"
              - "pint.json"
              - "phpunit.xml*"
            node:
              - "package.json"
              - "package-lock.json"
              - "packages/**/package.json"
              - "packages/**/*.{js,mjs,cjs,ts,tsx,vue,json}"
            e2e:
              - "tests/e2e/**"
              - "scripts/ci/**"
            workflows:
              - ".github/**"
              - "scripts/ci/**"

      - name: Plan lanes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FILTER_PHP: ${{ steps.filter.outputs.php }}
          FILTER_NODE: ${{ steps.filter.outputs.node }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" || "$REF" == "refs/heads/main" || "$FILTER_WORKFLOWS" == "true" || -z "$FILTER_PHP" ]]; then
            full=true; php=true; node=true; e2e=true
          else
            full=false
            php=${FILTER_PHP:-false}
            node=${FILTER_NODE:-false}
            e2e=${FILTER_E2E:-false}
          fi
          {
            echo "full=$full"
            echo "php=$php"
            echo "node=$node"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"
          echo "lanes full=$full php=$php node=$node e2e=$e2e"

  quality:
    name: Quality (stop-cranes, Pint, PHPStan, workflow lint)
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP and Composer
        uses: $/.github/actions/setup-php
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          python3 scripts/ci/engineering-rails.py --root "$GITHUB_WORKSPACE"
          python3 scripts/ci/engineering-rails.py --self-test

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer phpstan

      - name: Lint workflows
        uses: $/.github/actions/lint-workflows

      - name: Quality summary
        if: always()
        run: |
          {
            echo "## Quality"
            echo
            echo "Stop-cranes, composer validate, Pint, PHPStan, actionlint and zizmor ran on PHP 8.4 / Node 26.13.1."
          } >> "$GITHUB_STEP_SUMMARY"

  php:
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
        include:
          - postgres: '18.7'
            image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          - postgres: '19.0'
            image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"

      - name: Build DOCX CLI
        run: |
          npm --workspace=@vaulter/editor-pro-docx run build
          test -f packages/docx/dist/cli.js

      - name: Setup PHP and Composer
        uses: $/.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: ${{ matrix.php == '8.4' && matrix.postgres == '18.7' && 'pcov' || 'none' }}

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        env:
          EXPECTED: ${{ matrix.postgres }}
        run: |
          ver=$(psql -d vaulter -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          case "${ver}" in
            "${EXPECTED}"*) ;;
            *) echo "expected PostgreSQL ${EXPECTED}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Create suite database
        run: psql -d vaulter -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vaulter_test'

      - name: Run database migrations on PostgreSQL
        run: php scripts/ci/migrate-suite.php

      - name: Zero unindexed foreign keys
        run: psql -d vaulter_test -v ON_ERROR_STOP=1 -f scripts/ci/sql/unindexed-fks.sql

      # One database per Pest worker (vaulter_w<N>_test, N = 1..CPUs): the suites migrate and refresh
      # their database, so parallel workers must not share one.
      - name: Create per-worker databases
        run: |
          for worker in $(seq 1 "$(nproc)"); do
            psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_w${worker}_test"
          done

      - name: Pest on PostgreSQL ${{ matrix.postgres }}
        env:
          VAULTER_TEST_DB_PER_PROCESS: "1"
          WITH_COVERAGE: ${{ matrix.php == '8.4' && matrix.postgres == '18.7' && '1' || '0' }}
        run: |
          if [[ "$WITH_COVERAGE" == 1 ]]; then
            mkdir -p build/coverage
            composer test:parallel -- --coverage --coverage-clover build/coverage/clover.xml
          else
            composer test:parallel
          fi

      - name: Upload coverage
        if: matrix.php == '8.4' && matrix.postgres == '18.7'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-php-pgsql
          path: build/coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Pest on SQLite
        if: matrix.postgres == '18.7'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: composer test:parallel

  node:
    name: Node 26.13.1 docx and vue
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"

      - name: Build sibling @vaulter/vue
        run: |
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          npm --prefix "$workspace/vaulter" ci && npm --prefix "$workspace/vaulter" run build --workspace @vaulter/vue

      - name: Install npm dependencies
        run: npm ci

      - name: docx build, test and typecheck
        run: |
          npm --workspace=@vaulter/editor-pro-docx run build
          test -f packages/docx/dist/cli.js
          npm --workspace=@vaulter/editor-pro-docx test
          npm --workspace=@vaulter/editor-pro-docx run typecheck

      - name: vue test, typecheck and build
        run: |
          npm --workspace=@vaulter/editor-pro-vue test
          npm --workspace=@vaulter/editor-pro-vue run typecheck
          npm --workspace=@vaulter/editor-pro-vue run build

  docx-libreoffice:
    name: DOCX LibreOffice roundtrip
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"

      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Build @vaulter/editor-pro-docx
        run: npm --workspace=@vaulter/editor-pro-docx run build

      - name: Run headless LibreOffice D1-D5 roundtrip gate
        run: bash scripts/ci/docx-libreoffice.sh

  e2e:
    name: Playwright E2E
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP and Composer
        uses: $/.github/actions/setup-php
        with:
          php-version: "8.4"
          extensions: mbstring, xml, zip, pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"

      - name: Install sibling dependencies
        run: |
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          npm --prefix "$workspace/vaulter" ci
          npm --prefix "$workspace/vaulter" run build --workspace @vaulter/vue
          npm --prefix "$workspace/vaulter-collaboration" ci

      - name: Install editor-pro dependencies
        run: |
          npm ci
          npm --workspace=@vaulter/editor-pro-docx run build
          npm --workspace=@vaulter/editor-pro-vue run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: "5432"
          E2E_DB_DATABASE: vaulter_e2e_test
          E2E_DB_USERNAME: vaulter
          E2E_DB_PASSWORD: secret
        run: npx playwright test --config=tests/e2e/playwright.config.mjs
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaulter -d vaulter_e2e_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, quality, php, node, docx-libreoffice, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          lines = [f"- `{name}`: {job['result']}" for name, job in sorted(needs.items())]
          failed = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## CI gate\n\n")
                  fh.write("\n".join(lines) + "\n")
                  if failed:
                      fh.write("\nA skipped lane is allowed when the path filter dropped it; failed or cancelled jobs are not.\n")
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          if failed:
              sys.exit(1)
          print("all required jobs succeeded or were skipped")
          PY
